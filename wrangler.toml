name = "phim4k-addon"
main = "worker.mjs"
compatibility_date = "2026-10-01"
compatibility_flags = ["global_fetch_strictly_public"]
workers_dev = true

[[services]]
binding = "RELAY_WORKER"
service = "p4k-relay"

[vars]
HF_ENDPOINT = "https://huggingface.co"

# Cloudflare Cron Triggers:
# - :00 và :30: dispatch sync-realtime (30m/lần) + crawl (:00 mỗi 1h)
# - :10 và :40: dispatch match-hf (30m/lần, lùi sau sync-realtime 10 phút)
[triggers]
crons = ["0,30 * * * *", "10,40 * * * *"]
