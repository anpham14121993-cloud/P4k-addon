name = "phim4k-addon"
main = "worker.mjs"
compatibility_date = "2026-10-01"
compatibility_flags = ["global_fetch_strictly_public"]
workers_dev = true

[[services]]
binding = "RELAY_WORKER"
service = "p4k-relay"

[vars]
HF_ENDPOINT = "https://huggingface.co"

# Cloudflare Cron Triggers: chạy mỗi 30 phút.
# - Vào :00: dispatch crawl (1h/lần) + sync-realtime (30m/lần)
# - Vào :30: dispatch sync-realtime (30m/lần)
[triggers]
crons = ["*/30 * * * *"]
