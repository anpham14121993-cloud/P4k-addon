name = "phim4k-addon"
main = "worker.mjs"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
HF_ENDPOINT = "https://huggingface.co"

# Cloudflare Cron Triggers: chạy mỗi 30 phút.
# - Vào :00: dispatch crawl (1h/lần) + sync-realtime (30m/lần)
# - Vào :30: dispatch sync-realtime (30m/lần)
[triggers]
crons = ["*/30 * * * *"]
