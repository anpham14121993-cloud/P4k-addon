name: crawl

on:
  # Lịch chạy do Cloudflare Worker Cron Trigger dispatch (GitHub schedule hay bị bỏ nhịp).
  workflow_dispatch:
    inputs:
      budget:
        description: "Giây chạy tối đa"
        default: "3600"

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Dọn file của repo dead/junk
        continue-on-error: true
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: node clean-dead.mjs | tail -5
      - name: Đồng bộ phim mới từ Phim4K vào Turso DB
        continue-on-error: true
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          echo "=== ĐỒNG BỘ PHIM MỚI & TẬP MỚI VÀO TURSO DB ==="
          node backfill.mjs --type all --from-page 1 --to-page 3 --force --delay 200
      - name: Crawl (feed + inv + index tự cân bằng)
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          P4K_TURSO: "1"
          P4K_GAP: "200"
          P4K_FEED_TOP: "1"
          P4K_FEED_PAGES: "5"
          P4K_POLL_MS: "180000"
          P4K_POLL_PAGES: "1"
          P4K_POLL_UNTIL: "1800"
          P4K_FEED_LIMIT: "1000"
          P4K_BKT: "1"
          P4K_BKT_WORKERS: "4"
          P4K_BKT_SWEEPS: "2"
          P4K_BKT_EVERY: "600000"
          P4K_REPO_TTL: "21600000"
          P4K_REPO_TTL_NO_ID: "86400000"
          P4K_IDLE_EXIT: "60"
          P4K_WRITE_CAP: "200000"
        run: |
          set -o pipefail
          node auto.mjs "${{ github.event.inputs.budget || '3600' }}" 2>&1 | tee crawl.log
      - name: Summary
        if: always()
        run: |
          line=$(grep "AUTO SUMMARY" crawl.log | tail -1 || true)
          echo "$line"
          echo "$line" >> "$GITHUB_STEP_SUMMARY"
