name: sync-realtime

on:
  schedule:
    # Chạy mỗi 30 phút một lần
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      pages:
        description: "Số trang quét (mặc định 2)"
        default: "2"
        required: false

concurrency:
  group: p4k-sync-realtime
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Đồng bộ thời gian thực Phim4K (Smart Dedup)
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TURSO_TIMEOUT: "90000"
          TURSO_MAX_CONCURRENT: "2"
        run: |
          PAGES="${{ github.event.inputs.pages || '2' }}"
          node sync-realtime.mjs --pages "$PAGES" --delay 250 2>&1 | tee sync.log
      - name: Báo cáo kết quả
        if: always()
        run: |
          echo "### Kết quả Đồng bộ thời gian thực (Smart Dedup)" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          grep -A 10 "TỔNG KẾT ĐỒNG BỘ" sync.log >> "$GITHUB_STEP_SUMMARY" || tail -20 sync.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
