name: recheck-nov13

on:
  workflow_dispatch:
    inputs:
      budget:
        description: "Giây chạy tối đa (mặc định 3600)"
        default: "3600"
        required: false

concurrency:
  group: p4k-db-job
  cancel-in-progress: false

jobs:
  recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Kiểm tra 100% account rỗng + repo dead 10-13/11 (5 HF Tokens)
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          P4K_TURSO: "1"
          P4K_GAP: "140"
          P4K_CONCURRENCY: "12"
          TURSO_TIMEOUT: "90000"
          TURSO_MAX_CONCURRENT: "2"
        run: |
          set -o pipefail
          node recheck-nov13.mjs "${{ github.event.inputs.budget || '3600' }}" 2>&1 | tee recheck.log
      - name: Summary
        if: always()
        run: |
          echo "### Kết quả Kiểm tra 100% Account/Repo tới 13/11" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          grep "RECHECK SUMMARY" recheck.log | tail -1 >> "$GITHUB_STEP_SUMMARY" || tail -30 recheck.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
