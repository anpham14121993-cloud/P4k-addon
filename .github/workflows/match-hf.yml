name: match-hf

on:
  # Lịch định kỳ 2 giờ/lần vào phút :30 do Cloudflare Worker Cron Trigger dispatch (tránh kẹt & bỏ nhịp GitHub schedule).
  workflow_dispatch:
    inputs:
      limit:
        description: "Số lượng file_id miss cần kiểm tra mỗi run (0 = toàn bộ)"
        default: "300"
        required: false
      budget:
        description: "Thời gian chạy tối đa (giây)"
        default: "1200"
        required: false
      concurrency:
        description: "Luồng xử lý song song"
        default: "3"
        required: false
      type:
        description: "Loại phim: all | movie | series"
        default: "all"
        required: false
      cooldown_hours:
        description: "Số giờ chờ trước khi kiểm tra lại mã từng miss (mặc định 168 = 7 ngày)"
        default: "168"
        required: false
      dry_run:
        description: "Chỉ kiểm thử, không ghi DB (true/false)"
        default: "false"
        required: false

# Nhóm concurrency riêng biệt hoàn toàn với crawl (p4k-db-job) và sync-realtime (p4k-sync-realtime) để không bị kẹt pending.
concurrency:
  group: p4k-match-hf-${{ github.event.inputs.type || 'all' }}
  cancel-in-progress: false

jobs:
  match:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Đối chiếu mã API -> link Hugging Face (Size + 32-byte verify)
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          set -o pipefail
          EXTRA_ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
            EXTRA_ARGS="--dry-run"
          fi
          node match-hf.mjs \
            --type="${{ github.event.inputs.type || 'all' }}" \
            --limit="${{ github.event.inputs.limit || '300' }}" \
            --budget="${{ github.event.inputs.budget || '1200' }}" \
            --concurrency="${{ github.event.inputs.concurrency || '3' }}" \
            --cooldown-hours="${{ github.event.inputs.cooldown_hours || '168' }}" \
            $EXTRA_ARGS 2>&1 | tee match-hf.log
      - name: Báo cáo kết quả
        if: always()
        run: |
          echo "### Kết quả Đối chiếu Hugging Face" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          grep -A 5 "TỔNG KẾT ĐỐI CHIẾU HF" match-hf.log >> "$GITHUB_STEP_SUMMARY" || tail -25 match-hf.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
